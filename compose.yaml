services:
  postgres:
    image: postgres:17
    container_name: sample-postgres
    environment:
      POSTGRES_DB: sample
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
    ports:
      - "5432:5432"
    volumes:
      - sample-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sample-postgres-data: