name: Publish Container Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/lhanxi/sample-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/lhanxi/sample-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          platforms: linux/arm64
          push: false
          tags: local/sample-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/sample-${{ matrix.name }}:${{ github.sha }}
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=sample-${{ matrix.name }}
            org.opencontainers.image.description=Sample application ${{ matrix.name }} image

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Publish summary
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo
            echo "- Image: \`${{ matrix.image }}\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Immutable tag: \`sha-${GITHUB_SHA::7}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    name: Open dev promotion pull request
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v6
        with:
          repository: Lhanxi/sample-gitops
          ref: main
          token: ${{ secrets.SAMPLE_GITOPS_TOKEN }}

      - name: Update dev image tags
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:0:11}"

          sed -i "/^backend:/,/^[^ ]/ s/^    tag: .*/    tag: ${IMAGE_TAG}/" \
            environments/dev/backend-values.yaml
          sed -i "/^image:/,/^[^ ]/ s/^  tag: .*/  tag: ${IMAGE_TAG}/" \
            environments/dev/frontend-values.yaml

          grep -F "    tag: ${IMAGE_TAG}" environments/dev/backend-values.yaml
          grep -F "  tag: ${IMAGE_TAG}" environments/dev/frontend-values.yaml

      - name: Commit and push promotion branch
        id: promotion
        env:
          BRANCH_NAME: automation/promote-dev
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:0:11}"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "sample-app promotion bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            "${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" || true
          git checkout -b "$BRANCH_NAME"
          git add environments/dev/backend-values.yaml environments/dev/frontend-values.yaml
          git commit -m "chore(dev): promote images to ${IMAGE_TAG}"
          git push --force-with-lease origin "HEAD:${BRANCH_NAME}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update promotion pull request
        if: steps.promotion.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SAMPLE_GITOPS_TOKEN }}
          IMAGE_TAG: ${{ steps.promotion.outputs.image_tag }}
        run: |
          set -euo pipefail

          if gh pr view automation/promote-dev --repo Lhanxi/sample-gitops >/dev/null 2>&1; then
            gh pr edit automation/promote-dev \
              --repo Lhanxi/sample-gitops \
              --title "chore(dev): promote images to ${IMAGE_TAG}" \
              --body "Promotes the backend and frontend images built from [sample-app@${GITHUB_SHA}](https://github.com/Lhanxi/sample-app/commit/${GITHUB_SHA}) to dev."
          else
            gh pr create \
              --repo Lhanxi/sample-gitops \
              --base main \
              --head automation/promote-dev \
              --title "chore(dev): promote images to ${IMAGE_TAG}" \
              --body "Promotes the backend and frontend images built from [sample-app@${GITHUB_SHA}](https://github.com/Lhanxi/sample-app/commit/${GITHUB_SHA}) to dev."
          fi
