name: Trivy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  containers:
    name: Container image scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag sample-backend:test ./backend

      - name: Build frontend image
        run: docker build --tag sample-frontend:test ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sample-backend:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sample-frontend:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
