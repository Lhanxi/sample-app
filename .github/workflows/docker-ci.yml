name: Docker CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build ARM64 images
        run: docker compose build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
