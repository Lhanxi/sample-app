name: Feature Request
description: Propose a new feature or enhancement.
title: "[Feature]: "
labels:
  - type/feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature and the value it provides.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: Briefly describe the feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your proposed implementation.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Notes
      description: References, diagrams, screenshots or related issues.
